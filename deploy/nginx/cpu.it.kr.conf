server {
    listen 80;
    listen [::]:80;
    server_name cpu.it.kr;
    return 301 https://cpu.it.kr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cpu.it.kr;

    ssl_certificate /etc/letsencrypt/live/cpu.it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpu.it.kr/privkey.pem;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (Vite build output)
    root /var/www/cpu-front;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
